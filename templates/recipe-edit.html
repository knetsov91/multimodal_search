
{% block scripts %}
   <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}" />
    <script src="{{ url_for('static', path='edit_script.js') }}">

{% endblock %}

{% extends "layout.html" %}

{% block content %}
<h1 style="text-align:center">Add recipe</h1>
    <div id="container">
        <div id="header">

            <form id="recipe_edit_form" data-id="{{ id }}">
                <input type="file" accept="image/*" name="file" />
                <label for="recipe_title">Title</label>
                <input id="recipe_title" type="text" value="{{ recipe.title }}" name="recipe_title" />
                <label for="recipe_text">Text</label>
                <textarea id="recipe_text" name="recipe_text" />{{ recipe.text }}</textarea>
                <button type="submit" id="create-btn">Edit</button>
            </form>
            <img src={{ img }} id="preview" />
        </div>

    <p id="recipe-error"></p>
    </div>
{% endblock %}
